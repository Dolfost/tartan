name: Deploy

on: 
  push:
    branches: 
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ['Docs']
    types: [completed]

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    outputs:
        tag: ${{ steps.git.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: ubuntu.sh
          - os: windows-latest
            script: windows.bat
          - os: macos-latest
            script: darwin.sh
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build and deploy
      run: ./cicd/${{ matrix.script }} pack

